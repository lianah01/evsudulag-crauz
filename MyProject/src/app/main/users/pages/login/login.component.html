<div class="login-container">
  <mat-card class="login-card">
    <mat-card-title>Access Your Account</mat-card-title>
    <p class="error" *ngIf="loginError">{{loginError}}</p>
    <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Username</mat-label>
        <input matInput formControlName="username" type="email" required>
        <mat-error *ngIf="username?.hasError('required') && username?.touched">
          Email is required
        </mat-error>
        <mat-error *ngIf="username?.hasError('email') && username?.touched">
          Please enter a valid email
        </mat-error>
      </mat-form-field>
      
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Password</mat-label>
        <input matInput formControlName="password" type="password" required>
        <mat-error *ngIf="password?.hasError('required') && password?.touched">
          Password is required
        </mat-error>
      </mat-form-field>
      
      <button mat-raised-button color="primary" class="full-width" type="submit" [disabled]="loginForm.invalid">Login</button>
    </form>
  </mat-card>
</div>
