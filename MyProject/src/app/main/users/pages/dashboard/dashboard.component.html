  <div class="dashboard-container">
    <h2>DASHBOARD</h2>
    <div class="summary-cards">
      <mat-card *ngFor="let card of summaryCards" class="summary-card">
        <mat-card-content>
          <mat-icon>{{ card.icon }}</mat-icon>
          <div>
            <h3>{{ card.value }}</h3>
            <p>{{ card.title }}</p>
          </div>
        </mat-card-content>
      </mat-card>
    </div>
  
    <div class="chart-container">
      <canvas #barChart></canvas>
    </div>
  </div>
